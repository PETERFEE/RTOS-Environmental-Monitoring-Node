# OpenOCD configuration for the NUCLEO-F103RB (on-board ST-LINK/V2-1).
#
#   openocd -f openocd/stm32f103rb.cfg
#   arm-none-eabi-gdb build/rtos-iot-sensor-node.elf -ex "target extended-remote :3333"
#
# CLion uses this file for the "OpenOCD Download & Run" configuration; see
# docs/clion_setup.md.

source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32f1x.cfg]

reset_config srst_only srst_nogate connect_assert_srst

# The F103RB has 128 KB of flash in 1 KB pages.
set WORKAREASIZE 0x5000

$_TARGETNAME configure -event gdb-attach { halt }
$_TARGETNAME configure -event reset-init { adapter speed 4000 }

# Let GDB see FreeRTOS tasks as threads in CLion's debugger.
$_TARGETNAME configure -rtos FreeRTOS
